<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hasan Ali — Front End Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hasan Ali — Front End Developer specialising in Angular and Laravel web applications.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Apply theme before first paint to prevent flash of wrong theme -->
  <script>
    (function() {
      var stored = localStorage.getItem('portfolio-theme');
      var dark = stored ? stored === 'dark' : true;
      if (dark) document.documentElement.classList.add('dark');
      window.__loaderStart = Date.now();
    })();
  </script>

  <style>
    /* ── Loader reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Full-page loader ─────────────────────────────────────── */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090B;
      overflow: hidden;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html:not(.dark) #app-loader { background: #FAFAFA; }

    /* Fade-out class applied by Angular */
    #app-loader.loader-done {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* ── Ambient glow ─────────────────────────────────────────── */
    .loader-glow {
      position: absolute;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,197,94,0.14) 0%, transparent 68%);
      filter: blur(56px);
      animation: loaderGlowPulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    /* ── Horizontal scan line ─────────────────────────────────── */
    .loader-scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .loader-scan::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 0;
      width: 200px;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(34,197,94,0.06) 40%,
        rgba(34,197,94,0.18) 50%,
        rgba(34,197,94,0.06) 60%,
        transparent 100%
      );
      animation: loaderScanMove 1.6s cubic-bezier(0.4, 0, 0.6, 1) 0.15s both;
    }

    /* ── Grid lines (subtle) ──────────────────────────────────── */
    .loader-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34,197,94,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 100%);
    }
    html:not(.dark) .loader-grid {
      background-image:
        linear-gradient(rgba(34,197,94,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.07) 1px, transparent 1px);
    }

    /* ── Inner content ────────────────────────────────────────── */
    .loader-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    /* ── Monogram ─────────────────────────────────────────────── */
    .loader-monogram {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(5rem, 14vw, 8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: #FAFAFA;
      display: flex;
      align-items: baseline;
      gap: 0.02em;
      opacity: 0;
      transform: translateY(16px);
      animation: loaderSlideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }
    html:not(.dark) .loader-monogram { color: #18181B; }

    .loader-monogram-dot {
      color: #22c55e;
      display: inline-block;
      animation: loaderDotGlow 1.4s ease-in-out 0.9s infinite alternate;
    }

    /* ── Name ─────────────────────────────────────────────────── */
    .loader-name {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #71717A;
      margin-top: 8px;
      opacity: 0;
      animation: loaderFadeIn 0.5s ease-out 0.75s forwards;
    }

    /* ── Role tag ─────────────────────────────────────────────── */
    .loader-role {
      font-family: 'Courier New', 'Courier', monospace;
      font-size: clamp(0.7rem, 1.5vw, 0.8rem);
      color: #22c55e;
      margin-top: 18px;
      opacity: 0;
      animation: loaderFadeIn 0.5s ease-out 1.05s forwards;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loader-role-bracket {
      opacity: 0.5;
    }

    /* ── Progress track ───────────────────────────────────────── */
    .loader-track {
      margin-top: 44px;
      width: clamp(140px, 22vw, 200px);
      height: 2px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: loaderFadeIn 0.4s ease-out 0.6s forwards;
    }
    html:not(.dark) .loader-track { background: rgba(0,0,0,0.08); }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #15803d 0%, #22c55e 60%, #4ade80 100%);
      border-radius: 2px;
      animation: loaderBarFill 1.9s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
    }

    /* ── Corner accents ───────────────────────────────────────── */
    .loader-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: loaderFadeIn 0.4s ease-out 0.4s forwards;
    }
    .loader-corner--tl { top: 28px; left: 28px; border-top: 1px solid rgba(34,197,94,0.4); border-left: 1px solid rgba(34,197,94,0.4); }
    .loader-corner--tr { top: 28px; right: 28px; border-top: 1px solid rgba(34,197,94,0.4); border-right: 1px solid rgba(34,197,94,0.4); }
    .loader-corner--bl { bottom: 28px; left: 28px; border-bottom: 1px solid rgba(34,197,94,0.4); border-left: 1px solid rgba(34,197,94,0.4); }
    .loader-corner--br { bottom: 28px; right: 28px; border-bottom: 1px solid rgba(34,197,94,0.4); border-right: 1px solid rgba(34,197,94,0.4); }

    /* ── Keyframes ────────────────────────────────────────────── */
    @keyframes loaderSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes loaderFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes loaderBarFill {
      0%   { width: 0%; }
      55%  { width: 72%; }
      85%  { width: 90%; }
      100% { width: 100%; }
    }
    @keyframes loaderScanMove {
      from { transform: translateX(-200px); }
      to   { transform: translateX(calc(100vw + 200px)); }
    }
    @keyframes loaderGlowPulse {
      0%, 100% { opacity: 0.7; transform: scale(0.92); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }
    @keyframes loaderDotGlow {
      from { text-shadow: 0 0 6px rgba(34,197,94,0.4); }
      to   { text-shadow: 0 0 20px rgba(34,197,94,0.9), 0 0 40px rgba(34,197,94,0.4); }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .loader-scan::after,
      .loader-glow,
      .loader-fill,
      .loader-monogram,
      .loader-name,
      .loader-role,
      .loader-track,
      .loader-corner {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body>

  <!-- ── Full-page loader (removed by Angular after bootstrap) ── -->
  <div id="app-loader" role="status" aria-label="Loading portfolio">

    <!-- Ambient grid -->
    <div class="loader-grid" aria-hidden="true"></div>

    <!-- Radial glow -->
    <div class="loader-glow" aria-hidden="true"></div>

    <!-- Scan line sweep -->
    <div class="loader-scan" aria-hidden="true"></div>

    <!-- Corner brackets -->
    <div class="loader-corner loader-corner--tl" aria-hidden="true"></div>
    <div class="loader-corner loader-corner--tr" aria-hidden="true"></div>
    <div class="loader-corner loader-corner--bl" aria-hidden="true"></div>
    <div class="loader-corner loader-corner--br" aria-hidden="true"></div>

    <!-- Center content -->
    <div class="loader-inner">
      <div class="loader-monogram">
        H<span class="loader-monogram-dot">.</span>
      </div>
      <div class="loader-name">Hasan Ali</div>
      <div class="loader-role">
        <span class="loader-role-bracket">&lt;</span>
        Front End Developer
        <span class="loader-role-bracket">/&gt;</span>
      </div>
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>

  </div>

  <app-root></app-root>
</body>
</html>
