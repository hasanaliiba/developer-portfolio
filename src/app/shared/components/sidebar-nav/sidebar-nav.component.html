<nav class="fixed left-0 top-0 h-full w-14 bg-[var(--c-sidebar)] border-r border-[var(--c-border)] flex flex-col items-center py-6 z-50 transition-colors duration-200"
     aria-label="Primary navigation"
     data-no-print>

  <!-- Logo -->
  <a routerLink="/"
     aria-label="Home"
     class="font-mono text-[#22c55e] text-sm font-bold tracking-widest mb-auto hover:opacity-70 transition-opacity duration-200 cursor-pointer"
     style="writing-mode:vertical-rl;transform:rotate(180deg)">HA</a>

  <!-- Nav links -->
  <div class="flex flex-col items-center gap-7 mb-5">
    <a routerLink="/"
       routerLinkActive="is-active"
       [routerLinkActiveOptions]="{exact:true}"
       class="nav-link group cursor-pointer"
       aria-label="Home"
       style="writing-mode:vertical-rl;transform:rotate(180deg)">
      <span class="text-[10px] tracking-[0.18em] uppercase transition-colors duration-200 text-[var(--c-fg-subtle)] group-[.is-active]:text-[#22c55e] group-hover:text-[var(--c-fg-muted)]">Home</span>
    </a>
    <a routerLink="/work"
       routerLinkActive="is-active"
       class="nav-link group cursor-pointer"
       aria-label="Work"
       style="writing-mode:vertical-rl;transform:rotate(180deg)">
      <span class="text-[10px] tracking-[0.18em] uppercase transition-colors duration-200 text-[var(--c-fg-subtle)] group-[.is-active]:text-[#22c55e] group-hover:text-[var(--c-fg-muted)]">Work</span>
    </a>
    <a routerLink="/resume"
       routerLinkActive="is-active"
       class="nav-link group cursor-pointer"
       aria-label="Resume"
       style="writing-mode:vertical-rl;transform:rotate(180deg)">
      <span class="text-[10px] tracking-[0.18em] uppercase transition-colors duration-200 text-[var(--c-fg-subtle)] group-[.is-active]:text-[#22c55e] group-hover:text-[var(--c-fg-muted)]">Resume</span>
    </a>
    <a routerLink="/contact"
       routerLinkActive="is-active"
       class="nav-link group cursor-pointer"
       aria-label="Contact"
       style="writing-mode:vertical-rl;transform:rotate(180deg)">
      <span class="text-[10px] tracking-[0.18em] uppercase transition-colors duration-200 text-[var(--c-fg-subtle)] group-[.is-active]:text-[#22c55e] group-hover:text-[var(--c-fg-muted)]">Contact</span>
    </a>
  </div>

  <!-- Theme toggle -->
  <button (click)="theme.toggle()"
          [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          class="w-8 h-8 flex items-center justify-center rounded-md text-[var(--c-fg-subtle)] hover:text-[var(--c-fg-muted)] hover:bg-[var(--c-border)] transition-colors duration-200 cursor-pointer mb-1 focus:outline-none focus:ring-1 focus:ring-[#22c55e]">
    @if (theme.isDark()) {
      <!-- Sun icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4" aria-hidden="true">
        <path d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15zM10 7a3 3 0 100 6 3 3 0 000-6zM15.657 5.404a.75.75 0 10-1.06-1.06l-1.061 1.06a.75.75 0 001.06 1.06l1.06-1.06zM6.464 14.596a.75.75 0 10-1.06-1.06l-1.06 1.06a.75.75 0 001.06 1.06l1.06-1.06zM18 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0118 10zM5 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 015 10zM14.596 15.657a.75.75 0 001.06-1.06l-1.06-1.061a.75.75 0 10-1.06 1.06l1.06 1.061zM5.404 6.464a.75.75 0 001.06-1.06L5.404 4.343a.75.75 0 00-1.06 1.06l1.06 1.061z"/>
      </svg>
    } @else {
      <!-- Moon icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4" aria-hidden="true">
        <path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z" clip-rule="evenodd"/>
      </svg>
    }
  </button>
</nav>
