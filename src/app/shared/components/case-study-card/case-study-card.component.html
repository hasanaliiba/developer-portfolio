<!-- Reference-style horizontal card: browser preview left · content right -->
<a [routerLink]="['/work', study().slug]"
   class="group relative flex flex-col md:flex-row w-full rounded-2xl overflow-hidden cursor-pointer
          border border-[var(--c-border)] bg-[var(--c-surface)]
          transition-all duration-300 ease-out
          hover:-translate-y-1 hover:border-[#22c55e]/35
          hover:shadow-2xl hover:shadow-black/20
          focus:outline-none focus:ring-2 focus:ring-[#22c55e] focus:ring-offset-2
          focus:ring-offset-[var(--c-bg)]">

  <!-- ── Left: Browser-frame preview ─────────────────────────── -->
  <div class="relative md:w-[44%] flex-shrink-0 overflow-hidden
              bg-[var(--c-surface2)] border-b md:border-b-0 md:border-r border-[var(--c-border)]"
       [style.background]="hasBanner() ? '' : fallbackGradient()">

    <!-- Browser chrome bar -->
    <div class="flex items-center gap-1.5 px-4 py-2.5 bg-black/25 border-b border-white/8 flex-shrink-0"
         aria-hidden="true">
      <span class="w-2.5 h-2.5 rounded-full bg-red-400/70 flex-shrink-0"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-yellow-400/70 flex-shrink-0"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-green-400/70 flex-shrink-0"></span>
      <!-- Fake URL bar -->
      <div class="flex-1 h-4 mx-3 rounded-full bg-white/8 max-w-[140px]"></div>
    </div>

    <!-- Screenshot / gradient fill -->
    <div class="relative overflow-hidden h-44 sm:h-52 md:h-full min-h-[180px]">
      @if (hasBanner()) {
        <img [src]="study().bannerUrl"
             [alt]="study().title"
             loading="lazy"
             width="800" height="500"
             class="absolute inset-0 w-full h-full object-cover object-top
                    transition-transform duration-500 ease-out
                    group-hover:scale-[1.06]" />
        <!-- Subtle dark vignette -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/30 via-transparent to-transparent pointer-events-none"></div>
      } @else {
        <!-- Placeholder when no banner: green glow -->
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-24 h-24 rounded-full opacity-30"
               style="background:radial-gradient(circle,rgba(34,197,94,0.6),transparent 70%);filter:blur(16px)"></div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="rgba(34,197,94,0.4)" stroke-width="1.5"
               class="w-12 h-12 absolute" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
      }
    </div>
  </div>

  <!-- ── Right: Content ───────────────────────────────────────── -->
  <div class="flex flex-col flex-1 p-6 md:p-8 min-w-0">

    <!-- "— Title" header -->
    <div class="flex items-center gap-3 mb-3">
      <span class="w-7 h-[2px] bg-[#22c55e] flex-shrink-0
                   transition-all duration-300 group-hover:w-10"
            aria-hidden="true"></span>
      <h3 class="font-bold text-[var(--c-fg)] text-[17px] md:text-[19px] leading-tight truncate
                 transition-colors duration-200 group-hover:text-[#22c55e]">
        {{ localized().title }}
      </h3>
    </div>

    <!-- Description -->
    <p class="text-[var(--c-fg-muted)] text-[13px] leading-relaxed mb-5 line-clamp-2">
      {{ localized().subtitle }}
    </p>

    <!-- Feature bullets (from challengePoints / solutionItems / benefits) -->
    @if (featureBullets().length > 0) {
      <ul class="space-y-2 mb-6 flex-1">
        @for (bullet of featureBullets(); track bullet) {
          <li class="flex items-start gap-2.5 text-[12px] text-[var(--c-fg-muted)] leading-relaxed">
            <!-- Green checkmark -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                 class="w-3.5 h-3.5 text-[#22c55e] flex-shrink-0 mt-[2px]" aria-hidden="true">
              <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/>
            </svg>
            <span class="line-clamp-2">{{ bullet }}</span>
          </li>
        }
      </ul>
    } @else {
      <!-- Spacer when no bullets -->
      <div class="flex-1"></div>
    }

    <!-- Bottom: tags + CTA arrow -->
    <div class="flex items-end justify-between gap-4 mt-auto pt-4 border-t border-[var(--c-border)]">
      <!-- Tech stack chips -->
      <div class="flex flex-wrap gap-1.5 min-w-0">
        @for (tag of tags(); track tag) {
          <span class="inline-flex items-center text-[10px] font-mono px-2.5 py-1 rounded-lg
                       bg-[var(--c-surface2)] border border-[var(--c-border)]
                       text-[var(--c-fg-subtle)]
                       group-hover:border-[#22c55e]/25 transition-colors duration-200">
            {{ tag }}
          </span>
        }
      </div>

      <!-- CTA arrow -->
      <div class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-[#22c55e]
                  flex-shrink-0 transition-all duration-200
                  group-hover:gap-2.5">
        {{ lang.t().card.cta }}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
             class="w-3.5 h-3.5 transition-transform duration-200 group-hover:translate-x-0.5"
             aria-hidden="true">
          <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>
  </div>
</a>
