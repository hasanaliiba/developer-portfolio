<a [routerLink]="['/work', study().slug]" class="block bg-[#1a1a1a] border border-[#222] rounded-sm hover:border-[#22c55e] transition-colors group">
  <div class="h-44 overflow-hidden rounded-t-sm">
    <img [src]="study().bannerUrl" [alt]="study().title" class="w-full h-full object-cover opacity-75 group-hover:opacity-100 group-hover:scale-105 transition-all duration-300" />
  </div>
  <div class="p-4">
    <h3 class="text-white font-semibold mb-3">{{ study().title }}</h3>
    <div class="flex flex-wrap gap-1.5">
      @for (tag of study().tags; track tag) {
        <span class="bg-[#0d1f0d] text-[#22c55e] text-xs px-2 py-0.5 rounded-sm font-mono">{{ tag }}</span>
      }
    </div>
  </div>
</a>
