<section class="px-10 md:px-16 py-16 max-w-3xl">
  <!-- Back -->
  <a routerLink="/work"
     class="inline-flex items-center gap-2 text-[#475569] text-sm font-mono hover:text-[#22c55e] transition-colors duration-200 mb-12 cursor-pointer group">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform duration-200" aria-hidden="true">
      <path fill-rule="evenodd" d="M17 10a.75.75 0 01-.75.75H5.612l4.158 3.96a.75.75 0 11-1.04 1.08l-5.5-5.25a.75.75 0 010-1.08l5.5-5.25a.75.75 0 111.04 1.08L5.612 9.25H16.25A.75.75 0 0117 10z" clip-rule="evenodd"/>
    </svg>
    Back to Work
  </a>

  @if (study(); as s) {
    <!-- Banner -->
    <div class="w-full aspect-[21/9] rounded-lg overflow-hidden mb-10 bg-[#1E293B]">
      <img [src]="s.bannerUrl" [alt]="s.title" class="w-full h-full object-cover" />
    </div>

    <!-- Title -->
    <h1 class="font-bold text-[#F8FAFC] leading-tight tracking-tight mb-5"
        style="font-size: clamp(1.8rem, 4vw, 2.8rem)">{{ s.title }}</h1>

    <!-- Tags -->
    <div class="flex flex-wrap gap-2 mb-14">
      @for (tag of s.tags; track tag) {
        <span class="bg-[#0d1f0d] text-[#22c55e] text-[10px] tracking-widest uppercase px-3 py-1 rounded font-mono">{{ tag }}</span>
      }
    </div>

    <!-- PSR sections -->
    <div class="flex flex-col gap-10">
      <div class="border-l-2 border-[#22c55e] pl-6">
        <h2 class="text-[#22c55e] text-[10px] font-semibold tracking-[0.25em] uppercase mb-4 font-mono">Problem</h2>
        <p class="text-[#94A3B8] leading-relaxed text-[15px]">{{ s.problem }}</p>
      </div>
      <div class="border-l-2 border-[#334155] pl-6">
        <h2 class="text-[#64748B] text-[10px] font-semibold tracking-[0.25em] uppercase mb-4 font-mono">Solution</h2>
        <p class="text-[#94A3B8] leading-relaxed text-[15px]">{{ s.solution }}</p>
      </div>
      <div class="border-l-2 border-[#334155] pl-6">
        <h2 class="text-[#64748B] text-[10px] font-semibold tracking-[0.25em] uppercase mb-4 font-mono">Result</h2>
        <p class="text-[#94A3B8] leading-relaxed text-[15px]">{{ s.result }}</p>
      </div>
    </div>
  } @else {
    <div class="py-16">
      <p class="text-[#475569] font-mono text-sm">Case study not found.</p>
    </div>
  }
</section>
