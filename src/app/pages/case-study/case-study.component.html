<section class="px-12 py-16 max-w-3xl">
  <a routerLink="/work" class="text-[#555] text-sm font-mono hover:text-[#22c55e] transition-colors mb-10 inline-block">← Back to Work</a>
  @if (study(); as s) {
    <div class="w-full h-72 rounded-sm overflow-hidden mb-8">
      <img [src]="s.bannerUrl" [alt]="s.title" class="w-full h-full object-cover" />
    </div>
    <h1 class="text-white font-extrabold mb-5" style="font-size:clamp(1.8rem,4vw,2.8rem)">{{ s.title }}</h1>
    <div class="flex flex-wrap gap-2 mb-12">
      @for (tag of s.tags; track tag) {
        <span class="bg-[#0d1f0d] text-[#22c55e] text-xs px-3 py-1 rounded-sm font-mono">{{ tag }}</span>
      }
    </div>
    <div class="flex flex-col gap-10">
      <div class="border-l-2 border-[#22c55e] pl-6">
        <h2 class="text-[#22c55e] text-xs font-semibold tracking-[0.2em] uppercase mb-3">Problem</h2>
        <p class="text-[#888] leading-relaxed">{{ s.problem }}</p>
      </div>
      <div class="border-l-2 border-[#2a2a2a] pl-6">
        <h2 class="text-[#555] text-xs font-semibold tracking-[0.2em] uppercase mb-3">Solution</h2>
        <p class="text-[#888] leading-relaxed">{{ s.solution }}</p>
      </div>
      <div class="border-l-2 border-[#2a2a2a] pl-6">
        <h2 class="text-[#555] text-xs font-semibold tracking-[0.2em] uppercase mb-3">Result</h2>
        <p class="text-[#888] leading-relaxed">{{ s.result }}</p>
      </div>
    </div>
  } @else {
    <p class="text-[#555] font-mono text-sm">Case study not found.</p>
  }
</section>
