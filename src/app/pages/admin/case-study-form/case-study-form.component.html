<form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 md:grid-cols-2 gap-5">
  <div>
    <label for="title" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Title <span class="text-[#22c55e]" aria-label="required">*</span>
    </label>
    <input id="title" formControlName="title" type="text"
           class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 placeholder:text-[var(--c-fg-subtle)]"
           placeholder="Project Name" />
  </div>

  <div>
    <label for="slug" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Slug <span class="text-[#22c55e]" aria-label="required">*</span>
    </label>
    <input id="slug" formControlName="slug" type="text"
           class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 font-mono placeholder:text-[var(--c-fg-subtle)]"
           placeholder="project-name" />
  </div>

  <div class="md:col-span-2">
    <label for="bannerUrl" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Banner URL <span class="text-[#22c55e]" aria-label="required">*</span>
    </label>
    <input id="bannerUrl" formControlName="bannerUrl" type="url"
           class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 placeholder:text-[var(--c-fg-subtle)]"
           placeholder="https://example.com/image.jpg" />
  </div>

  <div class="md:col-span-2">
    <label for="tags" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Tags <span class="text-[#22c55e]" aria-label="required">*</span>
      <span class="text-[var(--c-fg-subtle)] normal-case ml-2 text-[10px]">(comma-separated)</span>
    </label>
    <input id="tags" formControlName="tags" type="text"
           class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 placeholder:text-[var(--c-fg-subtle)]"
           placeholder="Angular, TypeScript, Web App" />
  </div>

  <div class="md:col-span-2">
    <label for="problem" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Problem <span class="text-[#22c55e]" aria-label="required">*</span>
    </label>
    <textarea id="problem" formControlName="problem" rows="3"
              class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 resize-none placeholder:text-[var(--c-fg-subtle)]"
              placeholder="What challenge existed before this project?"></textarea>
  </div>

  <div class="md:col-span-2">
    <label for="solution" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Solution <span class="text-[#22c55e]" aria-label="required">*</span>
    </label>
    <textarea id="solution" formControlName="solution" rows="3"
              class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 resize-none placeholder:text-[var(--c-fg-subtle)]"
              placeholder="How did you approach and solve it?"></textarea>
  </div>

  <div class="md:col-span-2">
    <label for="result" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
      Result <span class="text-[#22c55e]" aria-label="required">*</span>
    </label>
    <textarea id="result" formControlName="result" rows="3"
              class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 resize-none placeholder:text-[var(--c-fg-subtle)]"
              placeholder="What was the measurable outcome or impact?"></textarea>
  </div>

  <div>
    <label for="order" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">Display Order</label>
    <input id="order" formControlName="order" type="number" min="0"
           class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-2.5 rounded-md text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200" />
  </div>

  <div class="flex items-center gap-3 pt-6">
    <input formControlName="visible" type="checkbox" id="visible" class="accent-[#22c55e] w-4 h-4 cursor-pointer" />
    <label for="visible" class="text-[var(--c-fg-muted)] text-sm cursor-pointer select-none">Visible to public</label>
  </div>

  <div class="md:col-span-2 flex gap-3 pt-2">
    <button type="submit" [disabled]="form.invalid"
            class="inline-flex items-center gap-2 bg-[#22c55e] text-black font-semibold text-sm px-6 py-2.5 rounded hover:bg-[#16a34a] transition-colors duration-200 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#22c55e] focus:ring-offset-2 focus:ring-offset-[var(--c-surface)]">
      {{ study() ? 'Save Changes' : 'Add Case Study' }}
    </button>
    <button type="button" (click)="cancel()"
            class="border border-[var(--c-border)] text-[var(--c-fg-muted)] text-sm px-6 py-2.5 rounded hover:border-[var(--c-border2)] hover:text-[var(--c-fg)] transition-colors duration-200 cursor-pointer">Cancel</button>
  </div>
</form>
