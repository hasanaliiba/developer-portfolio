<section class="max-w-6xl mx-auto px-6 md:px-10 py-16">
  <div class="max-w-lg">
    <p class="font-mono text-[#22c55e] text-xs tracking-[0.25em] uppercase mb-3">Get in touch</p>
    <h1 class="font-bold text-[var(--c-fg)] leading-none tracking-tight mb-12"
        style="font-size:clamp(2rem,5vw,3.5rem)">Contact</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5 mb-14" novalidate>
      <div>
        <label for="name" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
          Name <span class="text-[#22c55e]" aria-label="required">*</span>
        </label>
        <input id="name" formControlName="name" type="text" autocomplete="name"
               class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-3 rounded-xl text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 placeholder:text-[var(--c-fg-subtle)]"
               placeholder="Your name" />
      </div>
      <div>
        <label for="email" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
          Email <span class="text-[#22c55e]" aria-label="required">*</span>
        </label>
        <input id="email" formControlName="email" type="email" autocomplete="email"
               class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-3 rounded-xl text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 placeholder:text-[var(--c-fg-subtle)]"
               placeholder="you@example.com" />
      </div>
      <div>
        <label for="message" class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.2em] uppercase font-mono block mb-2">
          Message <span class="text-[#22c55e]" aria-label="required">*</span>
        </label>
        <textarea id="message" formControlName="message" rows="5"
                  class="w-full bg-[var(--c-input)] border border-[var(--c-border)] text-[var(--c-fg)] px-4 py-3 rounded-xl text-sm focus:border-[#22c55e] focus:outline-none focus:ring-1 focus:ring-[#22c55e] transition-colors duration-200 resize-none placeholder:text-[var(--c-fg-subtle)]"
                  placeholder="What's on your mind?"></textarea>
      </div>

      <div class="pt-1">
        <button type="submit"
                [disabled]="form.invalid || status() === 'sending'"
                class="inline-flex items-center gap-2 bg-[#22c55e] text-black font-semibold text-sm px-7 py-3.5 rounded-xl hover:bg-[#16a34a] transition-colors duration-200 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#22c55e] focus:ring-offset-2 focus:ring-offset-[var(--c-bg)] shadow-md shadow-green-500/20">
          @if (status() === 'sending') {
            <svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Sending…
          } @else { Send Message }
        </button>
      </div>

      @if (status() === 'sent') {
        <div class="flex items-center gap-2.5 text-[#22c55e] text-sm font-mono" role="status" aria-live="polite">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 flex-shrink-0" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd"/>
          </svg>
          Message sent! I'll get back to you soon.
        </div>
      }
      @if (status() === 'error') {
        <div class="flex items-center gap-2.5 text-red-500 text-sm font-mono" role="alert" aria-live="assertive">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 flex-shrink-0" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
          </svg>
          Something went wrong. Please try again.
        </div>
      }
    </form>

    <!-- Social links -->
    <div class="border-t border-[var(--c-border)] pt-10">
      <p class="text-[var(--c-fg-subtle)] text-[10px] tracking-[0.25em] uppercase font-mono mb-6">Find me online</p>
      <div class="flex flex-col gap-4">
        <a href="https://github.com/hasanaliiba" target="_blank" rel="noopener noreferrer"
           class="group inline-flex items-center gap-3 text-[var(--c-fg-muted)] hover:text-[#22c55e] transition-colors duration-200 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 flex-shrink-0" aria-hidden="true">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
          <span class="text-sm font-medium">GitHub</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3 opacity-0 group-hover:opacity-100 -translate-y-0.5 translate-x-0 group-hover:translate-x-0.5 group-hover:-translate-y-1 transition-all duration-200" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.22 14.78a.75.75 0 001.06 0l7.22-7.22v5.69a.75.75 0 001.5 0v-7.5a.75.75 0 00-.75-.75h-7.5a.75.75 0 000 1.5h5.69l-7.22 7.22a.75.75 0 000 1.06z" clip-rule="evenodd"/>
          </svg>
        </a>
        <a href="https://linkedin.com/in/hasanaliiba" target="_blank" rel="noopener noreferrer"
           class="group inline-flex items-center gap-3 text-[var(--c-fg-muted)] hover:text-[#22c55e] transition-colors duration-200 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 flex-shrink-0" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
          <span class="text-sm font-medium">LinkedIn</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3 opacity-0 group-hover:opacity-100 -translate-y-0.5 group-hover:translate-x-0.5 group-hover:-translate-y-1 transition-all duration-200" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.22 14.78a.75.75 0 001.06 0l7.22-7.22v5.69a.75.75 0 001.5 0v-7.5a.75.75 0 00-.75-.75h-7.5a.75.75 0 000 1.5h5.69l-7.22 7.22a.75.75 0 000 1.06z" clip-rule="evenodd"/>
          </svg>
        </a>
        <a href="mailto:hasanaliiba@gmail.com"
           class="group inline-flex items-center gap-3 text-[var(--c-fg-muted)] hover:text-[#22c55e] transition-colors duration-200 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 flex-shrink-0" aria-hidden="true">
            <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z"/>
            <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z"/>
          </svg>
          <span class="text-sm font-medium">Email</span>
        </a>
      </div>
    </div>
  </div>
</section>
