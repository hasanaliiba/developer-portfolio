    (function() {

      var dark = stored ? stored === 'dark' : true;
      if (dark) document.documentElement.classList.add('dark');
      window.__loaderStart = Date.now();
    })();

  <style>
    /* ── Loader reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Full-page loader ─────────────────────────────────────── */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090B;
      overflow: hidden;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html:not(.dark) #app-loader { background: #FAFAFA; }

    /* Fade-out class applied by Angular */
    #app-loader.loader-done {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* ── Ambient glow ─────────────────────────────────────────── */
    .loader-glow {
      position: absolute;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,197,94,0.14) 0%, transparent 68%);
      filter: blur(56px);
      animation: loaderGlowPulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    /* ── Horizontal scan line ─────────────────────────────────── */
    .loader-scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .loader-scan::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 0;
      width: 200px;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(34,197,94,0.06) 40%,
        rgba(34,197,94,0.18) 50%,
        rgba(34,197,94,0.06) 60%,
        transparent 100%
      );
      animation: loaderScanMove 1.6s cubic-bezier(0.4, 0, 0.6, 1) 0.15s both;
    }

    /* ── Grid lines (subtle) ──────────────────────────────────── */
    .loader-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34,197,94,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 100%);
    }
    html:not(.dark) .loader-grid {
      background-image:
        linear-gradient(rgba(34,197,94,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.07) 1px, transparent 1px);
    }

    /* ── Inner content ────────────────────────────────────────── */
    .loader-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
    }

    /* ── Monogram ─────────────────────────────────────────────── */
    .loader-monogram {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(5rem, 14vw, 8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: #FAFAFA;
      display: flex;
      align-items: baseline;
      gap: 0.02em;
      opacity: 0;
      transform: translateY(16px);
      animation: loaderSlideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }
    html:not(.dark) .loader-monogram { color: #18181B; }

    .loader-monogram-dot {
      color: #22c55e;
      display: inline-block;
      animation: loaderDotGlow 1.4s ease-in-out 0.9s infinite alternate;
    }

    /* ── Name ─────────────────────────────────────────────────── */
    .loader-name {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #71717A;
      margin-top: 8px;
      opacity: 0;
      animation: loaderFadeIn 0.5s ease-out 0.75s forwards;
    }

    /* ── Role tag ─────────────────────────────────────────────── */
    .loader-role {
      font-family: 'Courier New', 'Courier', monospace;
      font-size: clamp(0.7rem, 1.5vw, 0.8rem);
      color: #22c55e;
      margin-top: 18px;
      opacity: 0;
      animation: loaderFadeIn 0.5s ease-out 1.05s forwards;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loader-role-bracket {
      opacity: 0.5;
    }

    /* ── Progress track ───────────────────────────────────────── */
    .loader-track {
      margin-top: 44px;
      width: clamp(140px, 22vw, 200px);
      height: 2px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: loaderFadeIn 0.4s ease-out 0.6s forwards;
    }
    html:not(.dark) .loader-track { background: rgba(0,0,0,0.08); }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #15803d 0%, #22c55e 60%, #4ade80 100%);
      border-radius: 2px;
      animation: loaderBarFill 1.9s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
    }

    /* ── Corner accents ───────────────────────────────────────── */
    .loader-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: loaderFadeIn 0.4s ease-out 0.4s forwards;
    }
